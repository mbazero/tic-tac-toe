[package]
name = "tic-tac-toe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
bytemuck = "1.23.2"
clap = { version = "4.5.48", features = ["derive"] }
enum_dispatch = "0.3.13"
ordered-float = { version = "5.0.0", features = ["bytemuck"] }
rand = "0.9.2"
regex = "1.11.2"
smallvec = "1.15.1"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.16"

[dev-dependencies]
rstest = "0.19"
